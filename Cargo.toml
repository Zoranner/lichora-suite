[package]
name = "headless_browser"
version = "0.1.0"
edition = "2021"
description = "Headless browser implementation using CEF for Unity integration"
authors = ["KimoTech"]
license = "MIT"

[workspace]
members = [".", "crates/ipc", "crates/ipc_native"]
resolver = "2"

[lib]
name = "headless_browser_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "headless_browser"
path = "src/main.rs"

[features]
default = ["cef"]
cef = ["dep:cef"]

[dependencies]
# CEF bindings
cef = { version = "145", optional = true }

# File-backed memory maps for EmbeddedBrowser IPC v2
memmap2 = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# UUID for memory names
uuid = { version = "1.0", features = ["v4"] }

# Serialization (for JavaScript results)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cross-platform utilities
cfg-if = "1.0"

# Ctrl+C handling
ctrlc = "3.4"

# EmbeddedBrowser IPC v2 core
ipc = { path = "crates/ipc" }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies
winapi = { version = "0.3", features = ["winuser", "errhandlingapi", "synchapi", "handleapi", "winbase", "winerror"] }

[dev-dependencies]
# Testing
tempfile = "3.0"

[build-dependencies]
# Build scripts
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[[example]]
name = "test_browser"
path = "examples/test_browser.rs"
