name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CEF_VERSION: "145.0.27"

jobs:
  test:
    name: Checks
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'crates/native-ime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust quality gate
        shell: pwsh
        run: .\scripts\check-quality.ps1

  build-windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Build Windows runtime
        shell: pwsh
        run: .\build.ps1 -Release

      - name: Package Windows runtime
        shell: pwsh
        run: |
          $archive = "lichora-win-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist\win-x64\* -DestinationPath $archive -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-win-x64
          path: lichora-win-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: ubuntu-latest
            dist: linux-x64
          - name: arm64
            os: ubuntu-24.04-arm
            dist: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            libasound2-dev \
            libgtk-3-dev \
            libnss3-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config \
            python3 \
            xz-utils

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            crates/native-ime/target/
          key: ${{ runner.os }}-${{ matrix.dist }}-release-cargo-${{ hashFiles('Cargo.lock', 'crates/native-ime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.dist }}-release-cargo-

      - name: Build Linux runtime
        run: ./build.sh --release --dist-name "${{ matrix.dist }}"

      - name: Package Linux runtime
        run: tar -czf "lichora-${{ matrix.dist }}-${GITHUB_REF_NAME}.tar.gz" -C dist "${{ matrix.dist }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-${{ matrix.dist }}
          path: lichora-${{ matrix.dist }}-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: macos-15-intel
            dist: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.dist }}-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.dist }}-release-cargo-

      - name: Build macOS runtime
        run: ./build.sh --release --dist-name "${{ matrix.dist }}"

      - name: Package macOS runtime
        run: tar -czf "lichora-${{ matrix.dist }}-${GITHUB_REF_NAME}.tar.gz" -C dist "${{ matrix.dist }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-${{ matrix.dist }}
          path: lichora-${{ matrix.dist }}-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/lichora-win-x64/lichora-win-x64-${{ github.ref_name }}.zip
            artifacts/lichora-linux-x64/lichora-linux-x64-${{ github.ref_name }}.tar.gz
            artifacts/lichora-linux-arm64/lichora-linux-arm64-${{ github.ref_name }}.tar.gz
            artifacts/lichora-macos-x64/lichora-macos-x64-${{ github.ref_name }}.tar.gz
