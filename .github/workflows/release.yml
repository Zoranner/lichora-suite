name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CEF_VERSION: "145.0.27"

jobs:
  test:
    name: Checks
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'crates/native-ime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust quality gate
        shell: pwsh
        run: .\scripts\check-quality.ps1

  build-windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Build Windows runtime
        shell: pwsh
        run: .\build.ps1 -Release

      - name: Package Windows runtime
        shell: pwsh
        run: |
          $archive = "lichora-win-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist\win-x64\* -DestinationPath $archive -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-win-x64
          path: lichora-win-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: ubuntu-latest
            dist: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            libasound2-dev \
            libgtk-3-dev \
            libnss3-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config \
            python3 \
            xz-utils

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            crates/native-ime/target/
          key: ${{ runner.os }}-${{ matrix.dist }}-release-cargo-${{ hashFiles('Cargo.lock', 'crates/native-ime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.dist }}-release-cargo-

      - name: Build Linux runtime
        run: ./build.sh --release --dist-name "${{ matrix.dist }}"

      - name: Package Linux runtime
        run: tar -czf "lichora-${{ matrix.dist }}-${GITHUB_REF_NAME}.tar.gz" -C dist "${{ matrix.dist }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-${{ matrix.dist }}
          path: lichora-${{ matrix.dist }}-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: macos-15-intel
            dist: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.dist }}-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.dist }}-release-cargo-

      - name: Build macOS runtime
        run: ./build.sh --release --dist-name "${{ matrix.dist }}"

      - name: Package macOS runtime
        run: tar -czf "lichora-${{ matrix.dist }}-${GITHUB_REF_NAME}.tar.gz" -C dist "${{ matrix.dist }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichora-${{ matrix.dist }}
          path: lichora-${{ matrix.dist }}-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Package native plugins
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          artifacts = Path("artifacts")
          package_root = Path(f"lichora-native-plugins-{tag}")
          archive_path = Path(f"lichora-native-plugins-{tag}.zip")

          if package_root.exists():
              shutil.rmtree(package_root)
          if archive_path.exists():
              archive_path.unlink()
          package_root.mkdir()

          targets = {
              "win-x64": {
                  "archive": artifacts / "lichora-win-x64" / f"lichora-win-x64-{tag}.zip",
                  "kind": "zip",
                  "files": ["lichora_ipc_native.dll", "process_host.dll"],
              },
              "linux-x64": {
                  "archive": artifacts / "lichora-linux-x64" / f"lichora-linux-x64-{tag}.tar.gz",
                  "kind": "tar",
                  "files": ["liblichora_ipc_native.so", "libprocess_host.so", "libnative_ime.so"],
              },
              "macos-x64": {
                  "archive": artifacts / "lichora-macos-x64" / f"lichora-macos-x64-{tag}.tar.gz",
                  "kind": "tar",
                  "files": ["liblichora_ipc_native.dylib", "libprocess_host.dylib"],
              },
          }

          def zip_member_by_basename(archive, basename):
              for name in archive.namelist():
                  if Path(name).name == basename:
                      return name
              raise FileNotFoundError(f"{basename} not found in {archive.filename}")

          def tar_member_by_basename(archive, basename):
              for member in archive.getmembers():
                  if member.isfile() and Path(member.name).name == basename:
                      return member
              raise FileNotFoundError(f"{basename} not found in {archive.name}")

          manifest_targets = {}
          checksums = []
          for target, spec in targets.items():
              target_dir = package_root / target
              target_dir.mkdir()
              archive_path_for_target = spec["archive"]
              if not archive_path_for_target.is_file():
                  raise FileNotFoundError(f"artifact not found: {archive_path_for_target}")

              manifest_targets[target] = []
              if spec["kind"] == "zip":
                  with zipfile.ZipFile(archive_path_for_target) as archive:
                      for file_name in spec["files"]:
                          member = zip_member_by_basename(archive, file_name)
                          output = target_dir / file_name
                          output.write_bytes(archive.read(member))
                          manifest_targets[target].append(file_name)
              else:
                  with tarfile.open(archive_path_for_target, "r:gz") as archive:
                      for file_name in spec["files"]:
                          member = tar_member_by_basename(archive, file_name)
                          extracted = archive.extractfile(member)
                          if extracted is None:
                              raise FileNotFoundError(f"{file_name} could not be extracted")
                          output = target_dir / file_name
                          output.write_bytes(extracted.read())
                          manifest_targets[target].append(file_name)

          manifest = {
              "name": "lichora-native-plugins",
              "version": tag,
              "targets": manifest_targets,
          }
          (package_root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          for path in sorted(package_root.rglob("*")):
              if path.is_file():
                  relative = path.relative_to(package_root).as_posix()
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  checksums.append(f"{digest}  {relative}")
          (package_root / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")

          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package_root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(package_root.parent).as_posix())
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/lichora-win-x64/lichora-win-x64-${{ github.ref_name }}.zip
            artifacts/lichora-linux-x64/lichora-linux-x64-${{ github.ref_name }}.tar.gz
            artifacts/lichora-macos-x64/lichora-macos-x64-${{ github.ref_name }}.tar.gz
            lichora-native-plugins-${{ github.ref_name }}.zip
