[package]
name = "process-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "process_host"
crate-type = ["cdylib"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
